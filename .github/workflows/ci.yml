# =============================================================================
# CI — defend the claims
# =============================================================================
# This repository asserts things about a dependency: that tracing is on by
# default, that spans carry payloads, that one environment variable accepts
# "yes" and another does not, that `set_trace_processors` replaces while
# `add_trace_processor` appends.
#
# An assertion nothing enforces is a comment. So CI:
#
#   - runs the contract tests against the real, freshly resolved SDK, so an
#     upstream change that invalidates the README breaks the build here
#     rather than in a reader's terminal;
#   - runs every no-key example end to end, each of which asserts its own
#     premise and exits non-zero if it stops demonstrating it;
#   - breaks all 30 controls one at a time and confirms the suite notices.
#
# CI does NOT call a model. That would need a key and would spend money on
# every push — a bill, not a test.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The contract tests are only useful if they run against SDK releases
    # nobody here has seen. Weekly, so a breaking upstream change surfaces
    # as a scheduled red build instead of as a confused reader.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The toolkit has no runtime dependencies, so it should hold across
        # every supported Python. A break on one is a real bug, not an
        # environment quirk.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Which SDK are we pinning claims against
        run: python -c "import importlib.metadata as m; print('openai-agents', m.version('openai-agents'))"

      - name: Lint
        run: ruff check src/ tests/ examples/ tools/

      - name: Tests
        run: pytest -q

  contract:
    name: Claims about the SDK still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the newest SDK
        run: pip install -e ".[dev]" --upgrade

      # Split into its own job so a failure here is legible at a glance:
      # it means the README and docs have gone stale, not that this
      # repository's own logic broke.
      - name: Contract tests
        run: pytest tests/test_sdk_contract.py -v

  examples:
    name: Examples still demonstrate their point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # Each of these asserts its own premise on the way out and exits
      # non-zero if the demonstration stops demonstrating. A README that
      # shows output nobody re-runs is a README that rots.
      - name: 01 · the defaults audit
        run: python examples/01-audit-your-defaults/audit_defaults.py

      - name: 02 · guardrails
        run: python examples/02-guardrails/run_guardrails.py

      - name: 03 · session isolation
        run: python examples/03-sessions/tenant_isolation.py

      # No --live, so no key and no spend. Everything up to the model call.
      - name: 04 · the assembled service
        run: python examples/04-the-service/triage_service.py

      - name: No example needs an API key
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is set in this job. Every example"
            echo "above is supposed to pass without one, and a key in the"
            echo "environment would hide it if that stopped being true."
            exit 1
          fi
          echo "confirmed: the examples above ran with no API key"

  mutation:
    name: Every control is enforced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # Exits non-zero on a SURVIVED mutant (a control nothing enforces), a
      # STALE one (the suite has drifted from the code) or an INVALID one
      # (the edit broke import instead of failing a test).
      - name: Break each control in turn
        run: python tools/mutate.py

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A broken relative link is the most common way a teaching repo rots:
      # cheap to check, tedious to find by hand.
      - name: Check relative links
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            while read -r link; do
              case "$link" in
                http*|mailto:*|"") continue ;;
              esac
              target="$dir/${link%%#*}"
              if [ ! -e "$target" ]; then
                echo "BROKEN  $file  ->  $link"
                fail=1
              fi
            done < <(grep -oE '\]\(([^)#:]+)\)' "$file" | sed -E 's/^\]\(//; s/\)$//')
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          exit $fail
